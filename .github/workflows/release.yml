name: Windows build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-test:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run public hygiene check
        shell: pwsh
        run: .\scripts\Check-PublicHygiene.ps1

      - name: Build and run automated tests
        shell: pwsh
        run: .\scripts\Build.ps1

      - name: Run isolated installation regression
        shell: pwsh
        run: .\scripts\Test-Installation.ps1

      - name: Verify native prompt, authorization, and cache prefix
        shell: pwsh
        run: node .\scripts\Test-NativePrompt.mjs .local\prompt-release --release

      - name: Package release artifacts
        shell: pwsh
        run: .\scripts\Package.ps1

      - name: Run offline update & rollback regression
        shell: pwsh
        run: .\scripts\Test-Update.ps1

      - name: Verify both distributions and rollback
        shell: pwsh
        run: .\scripts\Test-Distributions.ps1

      - name: Verify installed workflows never launch Codex CLI
        shell: pwsh
        run: .\scripts\Test-NoCli.ps1 -OutputDirectory .local\no-cli-release

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gravity-guardian-acceptance
          path: |
            .local/prompt-release/summary.json
            .local/no-cli-release/summary.json
          if-no-files-found: ignore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gravity-guardian-windows-x64
          path: |
            artifacts/gravity-guardian-*-windows-x64.zip
            artifacts/release-manifest.json
            artifacts/release-build-info.json
            artifacts/checksums.sha256
          if-no-files-found: error
